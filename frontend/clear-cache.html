<!-- 브라우저 캐시 무효화를 위한 임시 페이지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>캐시 초기화</title>
</head>
<body>
    <h1>브라우저 캐시 초기화 중...</h1>
    <p>다음 단계를 따라주세요:</p>
    <ol>
        <li><strong>Ctrl + Shift + Delete</strong> 눌러 브라우저 캐시 삭제</li>
        <li>또는 개발자 도구(F12) → Network 탭 → "Disable cache" 체크</li>
        <li>그 다음 <strong>Ctrl + F5</strong>로 강력 새로고침</li>
    </ol>
    <button onclick="location.href='index.html?v=' + Date.now()">메인 페이지로 이동</button>
    
    <script>
        // 3초 후 자동 이동
        setTimeout(() => {
            location.href = 'index.html?v=' + Date.now();
        }, 3000);
    </script>
</body>
</html>
