<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Edge Functions 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        .test-section {
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #f8f9fa;
        }
        .test-section h2 {
            color: #444;
            margin-bottom: 15px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .test-section h2::before {
            content: "🔧";
            font-size: 1.2em;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 0.9em;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95em;
            font-family: inherit;
        }
        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .info-box strong {
            color: #1976D2;
        }
        .session-info {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .session-info strong {
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Supabase Edge Functions 테스트</h1>
        <p class="subtitle">AI 영화 리뷰 사이트 - Supabase 마이그레이션 테스트</p>
        
        <div class="info-box">
            <strong>프로젝트 정보:</strong><br>
            URL: https://iwdivytuvwlpvzfnbigs.supabase.co<br>
            Functions: /functions/v1/*<br>
            브랜치: supabase-movie
        </div>

        <div class="session-info" id="sessionInfo">
            <strong>세션:</strong> 로그아웃 상태
        </div>

        <!-- 1. 회원가입 테스트 -->
        <div class="test-section">
            <h2>회원가입 테스트</h2>
            <div class="input-group">
                <label>사용자명:</label>
                <input type="text" id="regUsername" placeholder="testuser">
            </div>
            <div class="input-group">
                <label>비밀번호:</label>
                <input type="password" id="regPassword" placeholder="password123">
            </div>
            <button onclick="testRegister()">회원가입 테스트</button>
            <div id="regResult"></div>
        </div>

        <!-- 2. 로그인 테스트 -->
        <div class="test-section">
            <h2>로그인 테스트</h2>
            <div class="input-group">
                <label>사용자명:</label>
                <input type="text" id="loginUsername" placeholder="testuser">
            </div>
            <div class="input-group">
                <label>비밀번호:</label>
                <input type="password" id="loginPassword" placeholder="password123">
            </div>
            <button onclick="testLogin()">로그인 테스트</button>
            <div id="loginResult"></div>
        </div>

        <!-- 3. 게시글 작성 테스트 -->
        <div class="test-section">
            <h2>게시글 작성 테스트</h2>
            <div class="input-group">
                <label>제목:</label>
                <input type="text" id="postTitle" placeholder="테스트 게시글">
            </div>
            <div class="input-group">
                <label>내용:</label>
                <textarea id="postContent" placeholder="테스트 내용입니다."></textarea>
            </div>
            <button onclick="testCreatePost()">게시글 작성</button>
            <div id="postResult"></div>
        </div>

        <!-- 4. 게시글 목록 조회 -->
        <div class="test-section">
            <h2>게시글 목록 조회</h2>
            <button onclick="testGetPosts()">목록 불러오기</button>
            <div id="postsResult"></div>
        </div>

        <!-- 5. AI 리뷰 생성 테스트 -->
        <div class="test-section">
            <h2>AI 리뷰 생성 테스트</h2>
            <div class="input-group">
                <label>영화 제목:</label>
                <input type="text" id="movieTitle" placeholder="인셉션">
            </div>
            <div class="input-group">
                <label>사용자 리뷰:</label>
                <textarea id="userReview" placeholder="감정: 긴장됨, 추천: 추천함, 평점: 9점"></textarea>
            </div>
            <button onclick="testAIReview()">AI 리뷰 생성</button>
            <div id="aiReviewResult"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // 세션 정보 업데이트
        function updateSessionInfo() {
            const userId = Session.getUserId();
            const username = Session.getUsername();
            const info = document.getElementById('sessionInfo');
            
            if (userId && username) {
                info.innerHTML = `<strong>세션:</strong> 로그인 중 - 사용자: ${username} (ID: ${userId})`;
                info.style.background = '#d4edda';
                info.style.borderColor = '#c3e6cb';
            } else {
                info.innerHTML = '<strong>세션:</strong> 로그아웃 상태';
                info.style.background = '#fff3cd';
                info.style.borderColor = '#ffeaa7';
            }
        }

        // 결과 표시 헬퍼
        function showResult(elementId, data, isError = false) {
            const el = document.getElementById(elementId);
            el.className = 'result ' + (isError ? 'error' : 'success');
            el.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        }

        // 1. 회원가입 테스트
        async function testRegister() {
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;

            if (!username || !password) {
                showResult('regResult', '사용자명과 비밀번호를 입력하세요.', true);
                return;
            }

            try {
                const res = await fetch(API.register, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok && data.success) {
                    Session.setUser(data.id, username);
                    updateSessionInfo();
                    showResult('regResult', `✅ 회원가입 성공!\n사용자 ID: ${data.id}\n사용자명: ${username}`);
                } else {
                    showResult('regResult', `❌ 회원가입 실패:\n${data.error || JSON.stringify(data)}`, true);
                }
            } catch (err) {
                showResult('regResult', `❌ 오류 발생:\n${err.message}`, true);
            }
        }

        // 2. 로그인 테스트
        async function testLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showResult('loginResult', '사용자명과 비밀번호를 입력하세요.', true);
                return;
            }

            try {
                const res = await fetch(API.login, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok && data.user) {
                    Session.setUser(data.user.id, data.user.username);
                    updateSessionInfo();
                    showResult('loginResult', `✅ 로그인 성공!\n사용자 ID: ${data.user.id}\n사용자명: ${data.user.username}`);
                } else {
                    showResult('loginResult', `❌ 로그인 실패:\n${data.error || JSON.stringify(data)}`, true);
                }
            } catch (err) {
                showResult('loginResult', `❌ 오류 발생:\n${err.message}`, true);
            }
        }

        // 3. 게시글 작성 테스트
        async function testCreatePost() {
            const userId = Session.getUserId();
            if (!userId) {
                showResult('postResult', '❌ 로그인이 필요합니다.', true);
                return;
            }

            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;

            if (!title || !content) {
                showResult('postResult', '제목과 내용을 입력하세요.', true);
                return;
            }

            try {
                const res = await fetch(API.posts, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: parseInt(userId), title, content })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showResult('postResult', `✅ 게시글 작성 성공!\n게시글 ID: ${data.id || 'N/A'}`);
                } else {
                    showResult('postResult', `❌ 게시글 작성 실패:\n${data.error || JSON.stringify(data)}`, true);
                }
            } catch (err) {
                showResult('postResult', `❌ 오류 발생:\n${err.message}`, true);
            }
        }

        // 4. 게시글 목록 조회
        async function testGetPosts() {
            try {
                const res = await fetch(API.posts);
                const data = await res.json();
                
                if (res.ok && Array.isArray(data)) {
                    showResult('postsResult', `✅ 게시글 ${data.length}개 조회 성공:\n\n${JSON.stringify(data, null, 2)}`);
                } else {
                    showResult('postsResult', `❌ 조회 실패:\n${JSON.stringify(data)}`, true);
                }
            } catch (err) {
                showResult('postsResult', `❌ 오류 발생:\n${err.message}`, true);
            }
        }

        // 5. AI 리뷰 생성 테스트
        async function testAIReview() {
            const userId = Session.getUserId();
            if (!userId) {
                showResult('aiReviewResult', '❌ 로그인이 필요합니다.', true);
                return;
            }

            const movieTitle = document.getElementById('movieTitle').value;
            const userReview = document.getElementById('userReview').value;

            if (!movieTitle || !userReview) {
                showResult('aiReviewResult', '영화 제목과 사용자 리뷰를 입력하세요.', true);
                return;
            }

            try {
                const res = await fetch(API.aiReview, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: parseInt(userId), 
                        movie_title: movieTitle, 
                        user_review: userReview 
                    })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showResult('aiReviewResult', `✅ AI 리뷰 생성 성공!\n\nAI 리뷰:\n${data.ai_review}\n\n평점: ${data.rating}/10`);
                } else {
                    showResult('aiReviewResult', `❌ AI 리뷰 생성 실패:\n${data.error || JSON.stringify(data)}`, true);
                }
            } catch (err) {
                showResult('aiReviewResult', `❌ 오류 발생:\n${err.message}`, true);
            }
        }

        // 페이지 로드 시 세션 정보 업데이트
        updateSessionInfo();
    </script>
</body>
</html>
